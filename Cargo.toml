[package]
name = "live-subtitle"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Captures all system audio on macOS, transcribes it with whisper.cpp and shows Japanese subtitles"

[dependencies]
eframe = { version = "0.34", features = ["persistence"] }
screencapturekit = "11"
whisper-rs = { version = "0.16", features = ["metal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
core-graphics = "0.23"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSColor", "NSEvent"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }
raw-window-handle = "0.6"
rfd = "0.17"
signal-hook = "0.3"

[profile.release]
opt-level = 3
